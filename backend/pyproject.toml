[project]
name = "deeptutor-vtx-backend"
version = "0.1.0"
description = "DeepTutor web backend powered by the vtx agent SDK"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "croniter>=6.0,<7",
    "python-dateutil>=2.9,<3",
    "tzdata>=2024.1",
    "vtx-coding-agent>=1.3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
